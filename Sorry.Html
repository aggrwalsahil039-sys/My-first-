

 1<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>For You, My Love ❤️</title>
    <style>
        :root {
            --pink: #ffafbd;
            --dark-pink: #ffc3a0;
            --text-color: #555;
            --btn-yes: #4CAF50;
            --btn-no: #f44336;
        }

        body {
            margin: 0;
            padding: 0;
            overflow: hidden;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: linear-gradient(135deg, #ffafbd 0%, #ffc3a0 100%);
            font-family: 'Poppins', sans-serif; /* A cute and soft font */
        }

        .container {
            position: relative;
            text-align: center;
            z-index: 10;
        }

        /* Moving Cat Animation */
        .cat-container {
            width: 150px;
            margin: 0 auto;
            margin-bottom: 10px;
        }

        /* Speech Bubble */
        .card {
            background: rgba(255, 255, 255, 0.4);
            backdrop-filter: blur(20px);
            border: 2px solid rgba(255, 255, 255, 0.3);
            padding: 25px;
            border-radius: 30px;
            box-shadow: 0 10px 40px rgba(0, 0, 0, 0.1);
            max-width: 350px;
            min-height: 120px;
            display: flex;
            flex-direction: column;
            justify-content: center;
        }

        h1 { color: #d63384; margin-top: 0; font-size: 26px; }
        
        #text {
            font-size: 18px;
            color: var(--text-color);
            line-height: 1.6;
            font-weight: 500;
        }

        /* Buttons Styling */
        .btn-group {
            display: none;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .btn {
            padding: 10px 25px;
            border: none;
            border-radius: 50px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s ease;
        }

        #yesBtn {
            background-color: var(--btn-yes);
            color: white;
        }

        #noBtn {
            background-color: var(--btn-no);
            color: white;
            position: relative;
        }

        #voucher {
            margin-top: 15px;
            background: #ff4d6d;
            color: white;
            padding: 12px;
            border-radius: 20px;
            font-size: 16px;
            display: none;
            animation: fadeIn 1s;
        }

        /* Background Hearts and Sparkles */
        .heart, .sparkle {
            position: absolute;
            pointer-events: none;
            animation: moveUp 6s linear infinite;
        }

        @keyframes moveUp {
            0% { transform: translateY(110vh) rotate(0deg); opacity: 1; }
            100% { transform: translateY(-10vh) rotate(360deg); opacity: 0; }
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .click-hint {
            position: fixed;
            bottom: 20px;
            font-size: 14px;
            color: #d63384;
            font-weight: bold;
        }
    </style>
</head>
<body>

<audio id="music" loop>
    <source src="https://www.bensound.com/bensound-music/bensound-love.mp3" type="audio/mp3">
</audio>

<div class="container">
    <div class="cat-container">
        <img src="https://media.giphy.com/media/v1.Y2lkPTc5MGI3NjExM2o0NmxocnpwN2p0Mnc5Z25idWxhOXN1cTJlZzl6cHNqazRncmsycCZlcD12MV9pbnRlcm5hbF9naWZfYnlfaWQmY3Q9cw/W9f82kKThesD3N710z/giphy.gif" alt="Cute Cat" width="150px">
    </div>
    
    <div class="card">
        <h1>Hey ❤️</h1>
        <p id="text"></p>
        
        <div class="btn-group" id="btnGroup">
            <button class="btn" id="yesBtn" onclick="accepted()">Yes 😊</button>
            <button class="btn" id="noBtn" onmouseover="moveNo()" onclick="moveNo()">No 🥺</button>
        </div>

        <div id="voucher">
            🎟️ 1 Kiss Voucher 💋<br>
            <small>(Unlimited Validity)</small>
        </div>
    </div>
</div>

<div class="click-hint">Tap somewhere to start 🎵</div>

<script>
    const messages = [
        "I know you're upset with me... 😔",
        "And honestly, it's really breaking my heart. 💔",
        "I never wanted to hurt you.",
        "You're the most important person to me. 🥺",
        "Your smile is my favorite thing in the world ❤️",
        "Please don't stay mad for too long...",
        "Because I really, really miss you 😞",
        "Can you smile once for me? 😊"
    ];

    let i = 0;
    let j = 0;
    let started = false;

    // Start everything on first click
    document.body.addEventListener("click", () => {
        if (!started) {
            started = true;
            document.getElementById("music").play();
            document.querySelector(".click-hint").style.display = "none";
            typeMessage();
        }
    });

    function typeMessage() {
        if (i < messages.length) {
            let currentMsg = messages[i];
            let textElement = document.getElementById("text");
            textElement.innerHTML = ""; // Clear current text
            
            function typeChar() {
                if (j < currentMsg.length) {
                    textElement.innerHTML += currentMsg.charAt(j);
                    j++;
                    setTimeout(typeChar, 50); // Speed of typing
                } else {
                    i++;
                    j = 0;
                    setTimeout(typeMessage, 1500); // Time between messages
                }
            }
            typeChar();
        } else {
            // Show buttons after messages end
            document.getElementById("btnGroup").style.display = "flex";
        }
    }

    // Function for moving "No" button
    function moveNo() {
        const noBtn = document.getElementById("noBtn");
        const x = Math.random() * (window.innerWidth - noBtn.offsetWidth);
        const y = Math.random() * (window.innerHeight - noBtn.offsetHeight);
        
        noBtn.style.position = "absolute";
        noBtn.style.left = x + "px";
        noBtn.style.top = y + "px";
    }

    // Function for "Yes" click
    function accepted() {
        document.getElementById("btnGroup").style.display = "none";
        document.getElementById("text").innerHTML = "Thank you for forgiving me! I love you so much ❤️";
        document.getElementById("voucher").style.display = "block";
    }

    // Floating Hearts and Sparkles
    function createHeart() {
        const heart = document.createElement("div");
        heart.classList.add("heart");
        const icons = ["❤️", "💖", "🌸", "✨", "🌟"];
        heart.innerHTML = icons[Math.floor(Math.random() * icons.length)];
        
        heart.style.left = Math.random() * 100 + "vw";
        heart.style.fontSize = (Math.random() * 20 + 10) + "px";
        heart.style.duration = (Math.random() * 3 + 4) + "s";
        
        document.body.appendChild(heart);

        setTimeout(() => {
            heart.remove();
        }, 6000);
    }

    setInterval(createHeart, 400); // Frequency of floating elements
</script>

</body>
</html>
